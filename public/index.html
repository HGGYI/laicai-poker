<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>来财 - 打牌记账</title>
  
  <!-- iOS 独立全屏 App 适配 -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="来财记账">
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
  <link rel="icon" type="image/svg+xml" href="./icons/logo.svg">
  <link rel="manifest" href="./manifest.json">
  <meta name="theme-color" content="#f7f4ee">

  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <div id="app-container">
    
    <!-- 顶部状态栏 (纯净文字，无图标) -->
    <header class="app-header">
      <div>
        <span class="brand-text">来财</span>
        <span class="brand-subtext">打牌记账</span>
      </div>
      <div class="header-user-tag" id="top-user-name">未加入房间</div>
    </header>

    <!-- 视图A: 大厅界面 (未进房间时显示) -->
    <main id="view-lobby" class="view-container">
      <div class="clean-card">
        <h2 class="card-title">开始牌局</h2>
        <p class="card-desc">多人在线实时记账，系统自动计算最简结账方案</p>

        <div class="input-group">
          <label class="input-label" for="input-nickname">玩家名字 / 昵称</label>
          <input type="text" id="input-nickname" class="clean-input" placeholder="输入您的名字 (如: 东哥、老王)" maxlength="10">
        </div>

        <button id="btn-create-room" class="btn btn-primary" style="margin-top: 10px;">
          创建新房间 (随机6位房号)
        </button>

        <div style="text-align: center; margin: 18px 0; color: var(--text-muted); font-size: 13px;">
          或者加入已有牌局
        </div>

        <div style="display: flex; gap: 8px;">
          <input type="tel" id="input-room-id" class="clean-input" placeholder="输入6位房间号" maxlength="6" pattern="[0-9]*">
          <button id="btn-join-room" class="btn btn-secondary" style="width: 110px;">
            进入房间
          </button>
        </div>

        <div id="rejoin-box" style="margin-top: 16px; display: none; text-align: center;">
          <button id="btn-rejoin" class="btn btn-sm btn-outline" style="margin: 0 auto;">
            快速回到上一局 (<span id="rejoin-id"></span>)
          </button>
        </div>
      </div>
    </main>

    <!-- 视图B: 房间内容区 (通过底栏4个图标切换) -->
    <main id="view-room" class="view-container" style="display: none;">
      
      <!-- 房间顶条 (房号与退出) -->
      <div class="room-header-bar">
        <div class="room-id-box">
          <span class="room-id-label">当前房间号</span>
          <span class="room-id-value" id="room-number-display">------</span>
        </div>
        <div style="display: flex; gap: 6px;">
          <button id="btn-copy-room" class="btn btn-sm btn-secondary">复制房号</button>
          <button id="btn-leave-room" class="btn btn-sm btn-secondary">退出</button>
        </div>
      </div>

      <!-- Tab 1: 牌桌看板 -->
      <section id="tab-table" class="tab-content-pane">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
          <span style="font-size: 14px; font-weight: 700; color: var(--text-secondary);">玩家账目看板</span>
          <span style="font-size: 12px; color: var(--text-muted);" id="sync-indicator">实时同步中</span>
        </div>
        <div class="player-list" id="player-list-box">
          <!-- 动态渲染每位玩家 -->
        </div>
      </section>

      <!-- Tab 2: 记账转账 -->
      <section id="tab-pay" class="tab-content-pane" style="display: none;">
        <div class="clean-card">
          <h2 class="card-title">记账支付</h2>
          <p class="card-desc">选择收款人并输入金额，各玩家余额实时自动结算</p>

          <div class="input-group">
            <label class="input-label">选择收款人</label>
            <div class="target-chips-wrap" id="pay-targets-wrap">
              <!-- 动态生成收款人单选药丸 -->
            </div>
          </div>

          <div class="input-group">
            <div style="display: flex; justify-content: space-between; margin-bottom: 6px;">
              <label class="input-label" style="margin-bottom: 0;">转账金额 (元)</label>
              <span id="btn-clear-num" style="font-size: 12px; color: var(--accent-warm); cursor: pointer;">清空</span>
            </div>
            <input type="number" step="0.5" id="input-amount" class="clean-input" style="font-size: 24px; font-weight: 800; text-align: center; height: 54px;" placeholder="0.00">
          </div>

          <!-- 快捷筹码加注盘 -->
          <div class="chip-grid">
            <button class="chip-btn" data-val="1">+1</button>
            <button class="chip-btn" data-val="2">+2</button>
            <button class="chip-btn" data-val="5">+5</button>
            <button class="chip-btn" data-val="10">+10</button>
            <button class="chip-btn" data-val="20">+20</button>
            <button class="chip-btn" data-val="50">+50</button>
            <button class="chip-btn" data-val="100">+100</button>
            <button class="chip-btn" id="btn-half-num" style="font-size: 13px;">减半</button>
          </div>

          <div class="input-group">
            <label class="input-label">备注说明 (选填)</label>
            <input type="text" id="input-note" class="clean-input" placeholder="例如: 自摸、暗杠、买马">
          </div>

          <button id="btn-confirm-pay" class="btn btn-primary" style="height: 50px; margin-top: 6px;">
            确认记账
          </button>

          <!-- 快捷通吃通赔 -->
          <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 10px;">
            <button id="btn-win-all" class="btn btn-secondary btn-sm" style="height: 40px;">自摸 (收所有人)</button>
            <button id="btn-lose-all" class="btn btn-secondary btn-sm" style="height: 40px;">包牌 (赔所有人)</button>
          </div>
        </div>
      </section>

      <!-- Tab 3: 明细流水 -->
      <section id="tab-history" class="tab-content-pane" style="display: none;">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
          <span style="font-size: 14px; font-weight: 700; color: var(--text-secondary);">
            本局账本流水 (<span id="history-count">0</span>笔)
          </span>
          <button id="btn-undo-tx" class="btn btn-sm btn-outline">撤销上一笔</button>
        </div>
        <div class="tx-list" id="tx-list-box">
          <!-- 动态流水项 -->
        </div>
      </section>

      <!-- Tab 4: 结算总结 -->
      <section id="tab-summary" class="tab-content-pane" style="display: none;">
        <div class="clean-card">
          <h2 class="card-title">牌局结算战报</h2>
          <p class="card-desc">自动计算以最少转账次数完成全员清账</p>

          <div id="summary-rank-box" style="margin-bottom: 14px;">
            <!-- 排名成绩列表 -->
          </div>

          <div class="settle-card">
            <div style="font-size: 13px; font-weight: 700; color: var(--accent-warm);">
              最简转账结账建议
            </div>
            <div id="settle-steps-box">
              <!-- 结账路径步骤 -->
            </div>
          </div>

          <button id="btn-copy-report" class="btn btn-primary" style="margin-top: 10px;">
            复制微信战报文字
          </button>

          <button id="btn-reset-room" class="btn btn-danger" style="margin-top: 10px;">
            重置房间金额 (开启新一局)
          </button>
        </div>
      </section>

    </main>

    <!-- =========================================================
         核心要求2：全站仅保留最底部的四个图标导航栏！
         ========================================================= -->
    <nav class="bottom-nav-bar" id="app-bottom-nav" style="display: none;">
      <button class="nav-tab-btn active" data-tab="tab-table" id="nav-btn-table">
        <span class="nav-tab-icon">🀄</span>
        <span class="nav-tab-label">牌桌</span>
      </button>
      <button class="nav-tab-btn" data-tab="tab-pay" id="nav-btn-pay">
        <span class="nav-tab-icon">💸</span>
        <span class="nav-tab-label">记账</span>
      </button>
      <button class="nav-tab-btn" data-tab="tab-history" id="nav-btn-history">
        <span class="nav-tab-icon">📜</span>
        <span class="nav-tab-label">明细</span>
      </button>
      <button class="nav-tab-btn" data-tab="tab-summary" id="nav-btn-summary">
        <span class="nav-tab-icon">📊</span>
        <span class="nav-tab-label">结算</span>
      </button>
    </nav>

    <!-- 提示组件 -->
    <div class="toast-box" id="toast-el">提示</div>

  </div>

  <script src="./app.js"></script>
</body>
</html>
